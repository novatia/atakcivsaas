# Drop-in per il servizio principale opentakserver, che NON è nel repo (lo
# installa OTS). Va copiato in /etc/systemd/system/opentakserver.service.d/:
# così l'unit originale resta intatta e sopravvive agli upgrade di OTS.
#
# Perché serve: il processo principale tiene una connessione a RabbitMQ per
# socketio. Quando il broker si riavvia — e su Ubuntu lo fa da solo a ogni
# unattended-upgrade, verificato il 2026-09-22 — OTS non ha un vero ciclo di
# riconnessione. Se il processo muore, senza Restart=always resta morto.
#
#   cp -r ots/systemd/opentakserver.service.d /etc/systemd/system/
#   systemctl daemon-reload

[Service]
Restart=always
RestartSec=5s
