[project]
name = "OTS-SkyFi-Plugin"
version = "1.0.0"
description = "Ordini SkyFi su OpenTAKServer: lista asset acquistati, download deliverable e data package ATAK (fork di brian7704/OTS-SkyFi-Plugin)"
authors = [{name = "Andrea Novati", email = "email@nov41337.online"}]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10, <4.0"
dependencies = [
    "opentakserver>=1.7.0",
    "requests>=2.31",
]

[project.urls]
repository = "https://github.com/novatia/atakcivsaas"

[project.entry-points.'opentakserver.plugin']
ots_skyfi_plugin = 'ots_skyfi_plugin.app:SkyFiPlugin'

[tool.poetry]
include = [{path = "ots_skyfi_plugin/ui/**/*", format = ["sdist", "wheel"]}]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
