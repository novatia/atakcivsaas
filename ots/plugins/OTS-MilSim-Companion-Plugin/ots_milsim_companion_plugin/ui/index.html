<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MilSim Soft-Air Companion</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --border: #dde1e6; --text: #1b1f24;
    --muted: #6b7280; --accent: #2f6f3e; --accent-2: #4c8c5c;
    --present: #2e7d32; --absent: #c62828; --maybe: #ef6c00; --neutral: #78909c;
    --tab: #eceff1; --btn: #ffffff; --btn-hover: #f0f2f4; --input: #ffffff;
    --highlight-glow: rgba(47,111,62,.15);
  }
  /* Modalità notte: automatica dal sistema, forzabile con il bottone 🌙/☀️ */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14181c; --panel: #1e242b; --border: #333d47; --text: #e4e8ec;
      --muted: #93a0ad; --accent: #4d9861; --accent-2: #5fae74;
      --present: #43a047; --absent: #e05555; --maybe: #f58c2e; --neutral: #8aa0ae;
      --tab: #262d35; --btn: #262d35; --btn-hover: #2f3842; --input: #171c21;
      --highlight-glow: rgba(93,174,116,.22);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14181c; --panel: #1e242b; --border: #333d47; --text: #e4e8ec;
    --muted: #93a0ad; --accent: #4d9861; --accent-2: #5fae74;
    --present: #43a047; --absent: #e05555; --maybe: #f58c2e; --neutral: #8aa0ae;
    --tab: #262d35; --btn: #262d35; --btn-hover: #2f3842; --input: #171c21;
    --highlight-glow: rgba(93,174,116,.22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  #me-box { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  #me-box img { width: 32px; height: 32px; object-fit: contain; }
  nav { display: flex; gap: 4px; padding: 8px 20px 0; flex-wrap: wrap; }
  nav button { border: 1px solid var(--border); border-bottom: none; background: var(--tab); color: var(--text); padding: 8px 14px; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px; }
  nav button.active { background: var(--panel); font-weight: 600; color: var(--accent); }
  main { padding: 16px 20px 40px; }
  section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .btn { border: 1px solid var(--border); background: var(--btn); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.danger { color: var(--absent); border-color: #e7bdbd; }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .rsvp-group { display: inline-flex; gap: 4px; }
  .rsvp-group .btn.on-present { background: var(--present); color: #fff; border-color: var(--present); }
  .rsvp-group .btn.on-absent { background: var(--absent); color: #fff; border-color: var(--absent); }
  .rsvp-group .btn.on-maybe { background: var(--maybe); color: #fff; border-color: var(--maybe); }
  .badge-chip { display: inline-flex; align-items: center; gap: 6px; }
  .badge-chip img { width: 26px; height: 26px; object-fit: contain; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; color: #fff; }
  .pill.present { background: var(--present); } .pill.absent { background: var(--absent); }
  .pill.maybe { background: var(--maybe); } .pill.not_configured { background: var(--neutral); }
  .event-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .event-card.past { opacity: .65; }
  .event-card.highlight { outline: 3px solid var(--accent); box-shadow: 0 0 0 6px var(--highlight-glow); }
  .event-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .event-head strong { font-size: 15px; }
  .event-meta { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
  .event-desc { white-space: pre-wrap; margin: 6px 0; }
  .counts { font-size: 12px; color: var(--muted); }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  form.inline label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, textarea { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; background: var(--input); color: var(--text); }
  textarea { width: 100%; min-height: 60px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #263238; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; max-width: 380px; z-index: 2000; }
  /* Replay giocata */
  #rp-map { height: min(62vh, 560px); min-height: 340px; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; }
  .rp-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rp-clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; margin-left: auto; }
  .rp-speed.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #rp-slider { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  #rp-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  #rp-legend label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12.5px; }
  .rp-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.5); flex: none; }
  .rp-marker { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .rp-name { font-size: 11px; font-weight: 600; color: #111; background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 4px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  /* ---- Modalità di gioco (template missioni, partite) ---- */
  .btn:disabled { opacity: .5; cursor: default; }
  .pill.ok { background: var(--present); } .pill.err { background: var(--absent); }
  .pill.warn { background: var(--maybe); } .pill.neutral { background: var(--neutral); }
  .shape { display: inline-block; width: 13px; height: 13px; background: var(--c, #999); border: 1.5px solid rgba(0,0,0,.35); vertical-align: -2px; }
  .shape.circle { border-radius: 50%; }
  .shape.diamond { transform: rotate(45deg) scale(.9); }
  .map-shape { display: block; width: 16px; height: 16px; background: var(--c, #999); border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,.8); }
  .map-shape.circle { border-radius: 50%; }
  .map-shape.diamond { transform: rotate(45deg); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .tpl-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .tpl-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .tpl-head strong { font-size: 14.5px; }
  .tpl-meta { font-size: 12.5px; color: var(--muted); line-height: 1.5; }
  .tpl-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; padding-top: 6px; }
  .ed-grid { display: grid; grid-template-columns: 320px 1fr; gap: 14px; }
  @media (max-width: 900px) { .ed-grid { grid-template-columns: 1fr; } }
  .ed-side { display: flex; flex-direction: column; gap: 10px; }
  .ed-side label.field { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); width: 100%; }
  .ed-side input, .ed-side select, .ed-side textarea { width: 100%; }
  #gm-map { height: 520px; border: 1px solid var(--border); border-radius: 8px; min-width: 0; }
  .palette { display: flex; flex-direction: column; gap: 6px; }
  .palette button { display: flex; align-items: center; gap: 8px; text-align: left; }
  .palette button.placing { outline: 2px solid var(--accent); }
  .pkg-list { max-height: 160px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  .pkg-list label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
  .draw-hint { background: var(--tab); border: 1px dashed var(--border); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; }
  .match-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .countdown { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 700; }
  .mode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .mode-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; }
  .mode-card ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.7; }
</style>
<script>
  // Applica subito il tema salvato per evitare il flash chiaro/scuro al caricamento
  try {
    const saved = localStorage.getItem("ec_theme");
    if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<header>
  <h1>🎯 MilSim Soft-Air Companion</h1>
  <div id="me-box"></div>
  <button class="btn" id="theme-btn" onclick="toggleTheme()" title="Modalità notte/giorno">🌙</button>
</header>
<nav id="tabs"></nav>
<main><section class="panel" id="content">Caricamento…</section></main>
<div id="toast"></div>

<script>
"use strict";
const API = location.pathname.replace(/\/ui\/?$/, "");
let ME = null, FIELDS = [], RANKS = [];

function xsrf() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (opts.method && opts.method !== "GET") {
    const token = xsrf();
    opts.headers["X-XSRF-TOKEN"] = token;
    opts.headers["X-CSRFToken"] = token;
  }
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}
function toast(msg, ok = true) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = ok ? "#2e7d32" : "#c62828";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 4000);
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDT(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function isAdmin() { return ME && ME.roles.includes("administrator"); }

/* ---------------- Modalità notte ---------------- */
function isDarkNow() {
  const t = document.documentElement.dataset.theme;
  if (t) return t === "dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function updateThemeButton() {
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = isDarkNow() ? "☀️" : "🌙";
}
function toggleTheme() {
  const next = isDarkNow() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ec_theme", next); } catch (e) {}
  updateThemeButton();
}
updateThemeButton();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
function badgeImg(rank, size) {
  if (!rank || !rank.badge_filename) return "";
  return `<img src="${API}/badges/${encodeURIComponent(rank.badge_filename)}" width="${size}" height="${size}" style="object-fit:contain" alt="">`;
}

/* ---------------- Tabs ---------------- */
const TABS = [
  { id: "events", label: "Eventi", admin: true, render: () => { clearEventHash(); renderEvents(); } },
  { id: "gm_templates", label: "Template missioni", admin: true, render: () => { clearEventHash(); renderTemplates(); } },
  { id: "gm_matches", label: "Partite", admin: true, render: () => { clearEventHash(); renderMatches(); } },
  { id: "gm_modes", label: "Modalità di gioco", admin: true, render: () => { clearEventHash(); renderModes(); } },
  { id: "leaderboard", label: "Classifica", admin: false, render: () => { clearEventHash(); renderLeaderboard(); } },
  { id: "attendance", label: "Presenze", admin: true, render: renderAttendance },
  { id: "players", label: "Giocatori", admin: true, render: renderPlayers },
  { id: "fields", label: "Campi da gioco", admin: true, render: renderFields },
  { id: "ranks", label: "Gradi e badge", admin: true, render: renderRanks },
  { id: "import", label: "Import", admin: true, render: renderImport },
  { id: "maintenance", label: "Manutenzione", admin: true, render: renderMaintenance },
];
let currentTab = "events";

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.style.display = "flex";
  document.getElementById("content").style.borderRadius = "";
  nav.innerHTML = "";
  for (const tab of TABS) {
    if (tab.admin && !isAdmin()) continue;
    const btn = document.createElement("button");
    btn.textContent = tab.label;
    btn.className = tab.id === currentTab ? "active" : "";
    btn.onclick = () => {
      // Editor template aperto: chiedi conferma prima di buttare le modifiche
      if (ED && !confirm("Stai modificando un template di missione: uscire senza salvare?")) return;
      ED = null;
      clearInterval(MATCH_TIMER);
      currentTab = tab.id; renderTabs(); tab.render();
    };
    nav.appendChild(btn);
  }
}
// Cambio tab programmato (es. dopo il Play si passa alle Partite)
function gmGoTab(id) {
  currentTab = id;
  renderTabs();
  TABS.find(t => t.id === id).render();
}

async function refreshMe() {
  ME = await api("/me");
  const box = document.getElementById("me-box");
  const rank = ME.rank;
  const name = ME.player ? ME.player.display_name : ME.username;
  box.innerHTML = `${rank ? badgeImg(rank, 32) : ""}
    <span><strong>${esc(name)}</strong>${rank ? " · " + esc(rank.name) : ""} · ${ME.score} punti</span>`;
}

/* ---------------- Eventi ---------------- */
async function renderEvents() {
  const el = document.getElementById("content");
  el.innerHTML = "<h2>Eventi</h2><div id='ev-admin'></div><div id='ev-list'>Caricamento…</div>";

  if (isAdmin()) {
    if (!FIELDS.length) FIELDS = await api("/fields");
    document.getElementById("ev-admin").innerHTML = `
      <h3>Nuovo evento</h3>
      <form class="inline" id="ev-form">
        <label>Titolo <input name="title" required></label>
        <label>Sede di gioco <select name="field_id" required>
          ${FIELDS.filter(f => f.active).map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}
        </select></label>
        <label>Inizio <input type="datetime-local" name="start_time" required></label>
        <label>Fine <input type="datetime-local" name="end_time" required></label>
        <label style="flex:1;min-width:220px">Descrizione <input name="description"></label>
        <button class="btn primary" type="submit">Crea evento</button>
      </form><h3>Calendario</h3>`;
    document.getElementById("ev-form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/events", { method: "POST", body: Object.fromEntries(fd.entries()) });
        toast("Evento creato"); renderEvents();
      } catch (err) { toast(err.message, false); }
    };
  }

  const events = await api("/events");
  const list = document.getElementById("ev-list");
  window._events = events;

  const now = new Date();
  const isPast = ev => new Date(ev.end_time) < now;
  const pastCount = events.filter(isPast).length;

  // Eventi passati nascosti di default; flag per mostrarli (ricordata sul dispositivo)
  let showPast = false;
  try { showPast = localStorage.getItem("ec_show_past") === "1"; } catch (e) {}
  const visible = showPast ? events : events.filter(e => !isPast(e));

  let html = pastCount ? `<label class="muted" style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
      <input type="checkbox" ${showPast ? "checked" : ""} onchange="togglePast(this.checked)">
      Mostra eventi passati (${pastCount})</label>` : "";
  if (!visible.length) {
    list.innerHTML = html + "<p class='muted'>Nessun evento in programma.</p>";
    return;
  }
  list.innerHTML = html + visible.map(ev => {
    const past = isPast(ev);
    const st = ev.my_rsvp;
    return `<div class="event-card ${past ? "past" : ""}" id="event-${ev.id}">
      <div class="event-head">
        <strong><a href="#event-${ev.id}" style="color:inherit">${esc(ev.title)}</a></strong>
        <span class="pill ${st}">${{present:"Presente",absent:"Non presente",maybe:"In dubbio",not_configured:"Non configurato"}[st]}</span>
        <span style="margin-left:auto">
          <button class="btn small" onclick="copyEventLink(${ev.id})" title="Copia il link all'evento per condividerlo">📋 Copia link</button>
          ${isAdmin() ? `<button class="btn small" onclick="location.hash='#replay-${ev.id}'" title="Rivedi su mappa i movimenti degli EUD durante l'evento">▶ Giocata</button>
          <button class="btn small" onclick="editEvent(${ev.id})">✏️ Modifica</button>
          <button class="btn small danger" onclick="delEvent(${ev.id})">Elimina</button>` : ""}
        </span>
      </div>
      <div class="event-meta">📍 ${esc(ev.field ? ev.field.name : "?")}${ev.field && ev.field.address ? " — " + esc(ev.field.address) : ""}</div>
      <div class="event-meta">🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</div>
      ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ""}
      <div class="counts">✅ ${ev.counts.present} presenti · ❌ ${ev.counts.absent} assenti · ❔ ${ev.counts.maybe} in dubbio · 🏅 ${ev.counts.confirmed} confermati sul campo</div>
      ${past ? "" : `<div style="margin-top:8px" class="rsvp-group">
        <button class="btn ${st === "present" ? "on-present" : ""}" onclick="rsvp(${ev.id},'present')">Presente</button>
        <button class="btn ${st === "absent" ? "on-absent" : ""}" onclick="rsvp(${ev.id},'absent')">Non presente</button>
        <button class="btn ${st === "maybe" ? "on-maybe" : ""}" onclick="rsvp(${ev.id},'maybe')">In dubbio</button>
      </div>`}
    </div>`;
  }).join("");
}
function togglePast(show) {
  try { localStorage.setItem("ec_show_past", show ? "1" : "0"); } catch (e) {}
  renderEvents();
}

/* ---------------- Vista singolo evento (link condiviso) ---------------- */
function hashEventId() {
  const m = location.hash.match(/^#event-(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}
function clearEventHash() {
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
function goCalendar() {
  clearEventHash();
  if (isAdmin()) {
    currentTab = "events";
    renderTabs();
    renderEvents();
  } else {
    currentTab = "leaderboard";
    renderTabs();
    renderLeaderboard();
  }
}
async function renderEventDetail(id) {
  // Vista standalone del singolo evento: niente menu, solo l'evento
  document.getElementById("tabs").style.display = "none";
  const el = document.getElementById("content");
  el.style.borderRadius = "8px";
  el.innerHTML = "Caricamento…";
  let ev;
  try {
    ev = await api(`/events/${id}`);
  } catch (err) {
    el.innerHTML = `<h2>Evento non trovato</h2><p class="muted">${esc(err.message)}</p>`;
    return;
  }
  const past = new Date(ev.end_time) < new Date();
  const st = ev.my_rsvp;
  el.innerHTML = `
    <div class="event-card ${past ? "past" : ""}">
      <div class="event-head">
        <strong style="font-size:17px">${esc(ev.title)}</strong>
        <span class="pill ${st}">${{present:"Presente",absent:"Non presente",maybe:"In dubbio",not_configured:"Non configurato"}[st]}</span>
        <span style="margin-left:auto">
          ${isAdmin() ? `<button class="btn small" onclick="location.hash='#replay-${ev.id}'">▶ Giocata</button>` : ""}
          <button class="btn small" onclick="copyEventLink(${ev.id})">📋 Copia link</button>
        </span>
      </div>
      <div class="event-meta">📍 ${esc(ev.field ? ev.field.name : "?")}${ev.field && ev.field.address ? " — " + esc(ev.field.address) : ""}</div>
      <div class="event-meta">🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</div>
      ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ""}
      <div class="counts">✅ ${ev.counts.present} presenti · ❌ ${ev.counts.absent} assenti · ❔ ${ev.counts.maybe} in dubbio · 🏅 ${ev.counts.confirmed} confermati sul campo</div>
      ${past ? "<p class='muted'>Evento concluso.</p>" : ev.has_player ? `
      <p style="margin:10px 0 4px"><strong>La tua presenza:</strong></p>
      <div class="rsvp-group">

// Leaflet caricato on-demand da CDN solo quando si apre un replay
let _leafletPromise = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";
    css.crossOrigin = "";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
    js.crossOrigin = "";
    js.onload = resolve;
    js.onerror = () => { _leafletPromise = null; reject(new Error("Impossibile caricare la libreria mappa (serve la connessione internet)")); };
    document.body.appendChild(js);
  });
  return _leafletPromise;
}

const RP_COLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#808000","#9a6324","#469990","#800000","#000075","#fabed4","#aaffc3","#dcbeff","#bfef45"];
const RP_SPEEDS = [1, 3, 5, 10, 100];
let RP = null;          // stato del replay corrente
let _rpToken = 0;       // invalida il loop di animazione dei replay precedenti

function hashReplayId() {
  const m = location.hash.match(/^#replay-(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}

function rpClock(t) {
  return new Date(t * 1000).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function renderReplay(id) {
  document.getElementById("tabs").style.display = "none";
  const el = document.getElementById("content");
  el.style.borderRadius = "8px";
  el.innerHTML = "Caricamento tracce…";
  if (RP && RP.map) { try { RP.map.remove(); } catch (e) {} }
  RP = null;

  let data;
  try {
    await loadLeaflet();
    data = await api(`/events/${id}/replay`);
  } catch (err) {
    el.innerHTML = `<h2>Replay non disponibile</h2><p class="muted">${esc(err.message)}</p>
      <p><button class="btn" onclick="goCalendar()">← Torna al calendario</button></p>`;
    return;
  }

  const ev = data.event;
  const header = `
    <div class="rp-bar">
      <button class="btn" onclick="goCalendar()">← Calendario</button>
      <strong>▶ ${esc(ev.title)}</strong>
      <span class="muted">📍 ${esc(ev.field ? ev.field.name : "?")} · 🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</span>
    </div>`;

  if (!data.tracks.length) {
    el.innerHTML = header + `
      <p style="margin-top:14px">Nessuna traccia GPS registrata nella finestra dell'evento.</p>
      <p class="muted">Le tracce vengono salvate solo per gli EUD (ATAK/WinTAK) collegati al server
         durante la giocata, e richiedono che il processo cot_parser di OpenTAKServer sia attivo.</p>`;
    return;
  }

  el.innerHTML = header + `
    <div class="rp-bar" style="margin-top:10px">
      <button class="btn primary" id="rp-play" title="Riproduci/Pausa">▶</button>
      ${RP_SPEEDS.map(s => `<button class="btn rp-speed" data-speed="${s}">${s}x</button>`).join("")}
      <span class="rp-clock" id="rp-clock"></span>
    </div>
    <input type="range" id="rp-slider" min="${data.start}" max="${data.end}" step="1">
    <div id="rp-map"></div>
    <div id="rp-legend"></div>
    <p class="muted" style="margin-top:6px">Vengono mostrati tutti gli EUD che hanno inviato la posizione
       durante l'evento. Usa le caselle qui sopra per nascondere le tracce che non ti interessano.</p>`;

  const map = L.map("rp-map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  // Marker della sede di gioco
  if (ev.field && ev.field.latitude != null && ev.field.longitude != null) {
    L.marker([ev.field.latitude, ev.field.longitude], {
      icon: L.divIcon({ className: "", html: "📍", iconSize: [20, 20], iconAnchor: [10, 18] }),
    }).addTo(map).bindTooltip(ev.field.name);
  }

  const tracks = data.tracks.map((t, i) => {
    const color = RP_COLORS[i % RP_COLORS.length];
    const latlngs = t.points.map(p => [p[1], p[2]]);
    const marker = L.marker(latlngs[0], {
      icon: L.divIcon({
        className: "",
        html: `<div class="rp-marker"><span class="rp-dot" style="background:${color}"></span><span class="rp-name">${esc(t.callsign)}</span></div>`,
        iconSize: null,
        iconAnchor: [8, 8],
      }),
      zIndexOffset: 100,
    });
    const trail = L.polyline([], { color, weight: 3, opacity: 0.7 }).addTo(map);
    return { ...t, color, latlngs, marker, trail, onMap: false, visible: true, lastIdx: -2 };
  });

  const bounds = L.latLngBounds(tracks.flatMap(t => t.latlngs));
  map.fitBounds(bounds.pad(0.1));
  // Se il contenitore non era ancora dimensionato (iframe/tab appena mostrati) rimisura e ricentra
  setTimeout(() => { map.invalidateSize(); map.fitBounds(bounds.pad(0.1)); }, 150);

  // La riproduzione parte dal primo punto registrato, non dall'inizio (magari vuoto) dell'evento
  const firstT = Math.min(...tracks.map(t => t.points[0][0]));
  RP = {
    map, tracks,
    start: data.start, end: data.end,
    clock: Math.max(data.start, firstT),
    speed: 1, playing: false, last: null,
  };

  document.getElementById("rp-legend").innerHTML = tracks.map((t, i) => `
    <label><input type="checkbox" checked onchange="rpToggle(${i}, this.checked)">
    <span class="rp-dot" style="background:${t.color}"></span>${esc(t.callsign)}
    <span class="muted">(${t.points.length} punti)</span></label>`).join("");

  document.getElementById("rp-play").onclick = () => rpSetPlaying(!RP.playing);
  document.querySelectorAll(".rp-speed").forEach(btn => {
    btn.onclick = () => {
      RP.speed = parseInt(btn.dataset.speed, 10);
      document.querySelectorAll(".rp-speed").forEach(b => b.classList.toggle("on", b === btn));
    };
  });
  document.querySelector('.rp-speed[data-speed="1"]').classList.add("on");
  const slider = document.getElementById("rp-slider");
  slider.value = RP.clock;
  slider.oninput = () => { RP.clock = parseFloat(slider.value); rpUpdate(false); };

  rpUpdate(false);

  const token = ++_rpToken;
  requestAnimationFrame(function frame(ts) {
    if (token !== _rpToken || !document.getElementById("rp-map")) return;
    if (RP.playing && RP.last != null) {
      // dt limitato: al ritorno da una scheda in background il replay non deve saltare avanti
      const dt = Math.min(0.5, (ts - RP.last) / 1000);
      RP.clock = Math.min(RP.end, RP.clock + dt * RP.speed);
      if (RP.clock >= RP.end) rpSetPlaying(false);
      rpUpdate(true);
    }
    RP.last = ts;
    requestAnimationFrame(frame);
  });
}

function rpSetPlaying(playing) {
  if (!RP) return;
  // Se la riproduzione è arrivata in fondo, ▶ riparte dall'inizio
  if (playing && RP.clock >= RP.end) RP.clock = RP.start;
  RP.playing = playing;
  const btn = document.getElementById("rp-play");
  if (btn) btn.textContent = playing ? "⏸" : "▶";
}

function rpToggle(index, visible) {
  const t = RP.tracks[index];
  t.visible = visible;
  if (!visible) {
    if (t.onMap) { RP.map.removeLayer(t.marker); t.onMap = false; }
    RP.map.removeLayer(t.trail);
  } else {
    t.trail.addTo(RP.map);
    t.lastIdx = -2;
    rpUpdate(false);
  }
}

// Ultimo indice con timestamp <= t (ricerca binaria), -1 se prima del primo punto
function rpLocate(points, t) {
  let lo = 0, hi = points.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (points[mid][0] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function rpUpdate(fromLoop) {
  if (!RP) return;
  const clock = RP.clock;
  for (const t of RP.tracks) {
    if (!t.visible) continue;
    const i = rpLocate(t.points, clock);
    if (i < 0) {
      // Prima del primo punto di questo EUD: non ancora in mappa
      if (t.onMap) { RP.map.removeLayer(t.marker); t.onMap = false; }
      if (t.lastIdx !== -1) { t.trail.setLatLngs([]); t.lastIdx = -1; }
      continue;
    }
    if (!t.onMap) { t.marker.addTo(RP.map); t.onMap = true; }

    let lat = t.points[i][1], lon = t.points[i][2];
    if (i < t.points.length - 1) {
      // Interpolazione lineare tra due campioni, ma non sui buchi (EUD spento/offline)
      const a = t.points[i], b = t.points[i + 1], gap = b[0] - a[0];
      if (gap > 0 && gap <= 120) {
        const f = (clock - a[0]) / gap;
        lat = a[1] + (b[1] - a[1]) * f;
        lon = a[2] + (b[2] - a[2]) * f;
      }
    }
    t.marker.setLatLng([lat, lon]);
    if (i !== t.lastIdx) { t.trail.setLatLngs(t.latlngs.slice(0, i + 1)); t.lastIdx = i; }
  }
  const clockEl = document.getElementById("rp-clock");
  if (clockEl) clockEl.textContent = rpClock(clock);
  if (fromLoop) {
    const slider = document.getElementById("rp-slider");
    if (slider) slider.value = clock;
  }
}

function fmtBytes(n) {
  if (n == null) return "";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return n.toFixed(n >= 100 || i === 0 ? 0 : 1) + " " + units[i];
}
function baseLayers() {
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "© OpenStreetMap" });
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
    maxZoom: 19, attribution: "Esri World Imagery" });
  return { "Mappa (OSM)": osm, "Satellite (Esri)": sat };
}

let ED = null;          // stato dell'editor

async function openEditor(id) {
  const el = document.getElementById("content");
  el.innerHTML = "Caricamento editor…";
  try {
    await ensureRegistry();
    await loadLeaflet();

  } catch (e) {
    el.innerHTML = `<p>⚠️ ${esc(e.message)}</p>`;
    return;
  }
  const t = id ? TEMPLATES.find(x => x.id === id) : null;
  ED = {
    id: id,
    mode: t ? t.mode : "ctf",
    markers: t ? t.markers.map(m => ({ ...m })) : [],
    zones: t ? t.zones.map(z => ({ ...z, points: z.points.map(p => [...p]) })) : [],
    packages: new Set(t ? t.packages : []),
    placing: null,   // tipo marker in piazzamento
    drawing: null,   // {type, points, line} area in disegno
    map: null,
  };

  el.innerHTML = `
    <div class="toolbar">
      <h2 style="margin:0">${id ? "✏️ Modifica template" : "＋ Nuovo template"}</h2>
      <span style="flex:1"></span>
      <button class="btn" onclick="ED=null; renderTemplates()">Annulla</button>
      <button class="btn primary" onclick="saveTemplate(this)">💾 Salva</button>
    </div>
    <div class="ed-grid">
      <div class="ed-side">
        <label class="field">Titolo
          <input id="ed-title" value="${esc(t ? t.title : "")}" placeholder="es. CTF Bosco Nord">
        </label>
        <label class="field">Modalità
          <select id="ed-mode" onchange="changeMode(this.value)">
            ${Object.entries(REGISTRY.modes).map(([k, m]) =>
              `<option value="${k}" ${ED.mode === k ? "selected" : ""}>${m.icon} ${esc(m.name)}</option>`).join("")}
          </select>
        </label>
        <label class="field">Durata (minuti)
          <input id="ed-duration" type="number" min="1" max="1440" value="${t ? t.duration_minutes : 30}">
        </label>
        <label class="field">Descrizione
          <textarea id="ed-desc" rows="2" placeholder="regole, briefing…">${esc(t ? t.description || "" : "")}</textarea>
        </label>
        <div>
          <h3 style="margin-top:4px">Marker e aree <span class="muted">(clicca il tipo, poi la mappa)</span></h3>
          <div class="palette" id="ed-palette"></div>
          <div class="draw-hint" id="ed-hint" style="display:none"></div>
        </div>
        <div>
          <h3>Data package al Play</h3>
          ${PACKAGES.length ? `<div class="pkg-list">${PACKAGES.map(p => `
            <label><input type="checkbox" value="${esc(p.hash)}" ${ED.packages.has(p.hash) ? "checked" : ""}

  const layers = baseLayers();
  L.control.layers(layers).addTo(map);
  layers["Mappa (OSM)"].addTo(map);
  if (t && t.map && t.map.lat != null && t.map.lon != null) {
    map.setView([t.map.lat, t.map.lon], t.map.zoom || 15);
  } else if (ED.markers.length) {
    map.fitBounds(L.latLngBounds(ED.markers.map(m => [m.lat, m.lon])).pad(0.3));
  } else {
    map.setView([45.0, 9.7], 6);
  }
  // Container appena inserito nel DOM (iframe/tab): rimisura come per il replay
  setTimeout(() => map.invalidateSize(), 150);
  map.on("click", e => mapClick(e.latlng));

  ED.markers.forEach(m => addMarkerLayer(m));
  ED.zones.forEach(z => addZoneLayer(z));
  renderPalette();
}

function modeDef() { return REGISTRY.modes[ED.mode]; }
function countMarkers(type) { return ED.markers.filter(m => m.type === type).length; }
function countZones(type) { return ED.zones.filter(z => z.type === type).length; }

function changeMode(mode) {
  const def = REGISTRY.modes[mode];
  const badMarkers = ED.markers.filter(m => !(m.type in def.markers));
  const badZones = ED.zones.filter(z => !(z.type in def.zones));
  if ((badMarkers.length || badZones.length) &&
      !confirm(`Cambiando modalità verranno rimossi ${badMarkers.length} marker e ${badZones.length} aree non previsti in ${def.name}. Continuare?`)) {
    document.getElementById("ed-mode").value = ED.mode;
    return;
  }
  badMarkers.forEach(m => { ED.map.removeLayer(m._layer); });
  badZones.forEach(z => { ED.map.removeLayer(z._layer); });
  ED.markers = ED.markers.filter(m => m.type in def.markers);
  ED.zones = ED.zones.filter(z => z.type in def.zones);
  ED.mode = mode;
  cancelPlacing();
  renderPalette();
}

function renderPalette() {
  const def = modeDef();
  const box = document.getElementById("ed-palette");
  if (!box) return;
  let html = "";
  for (const [type, limits] of Object.entries(def.markers)) {
    const mt = REGISTRY.marker_types[type];
    const count = countMarkers(type);
    const full = count >= limits.max;
    html += `<button class="btn ${ED.placing === type ? "placing" : ""}" ${full ? "disabled" : ""}
      onclick="startPlacing('${type}')" title="${full ? "Numero massimo raggiunto" : "Clicca poi sulla mappa per piazzare"}">
      ${shapeHtml(type)} ${esc(mt.label)} <span class="muted" style="margin-left:auto">${count}/${limits.max}${limits.min ? " (min " + limits.min + ")" : ""}</span></button>`;
  }
  for (const [type, limits] of Object.entries(def.zones)) {
    const zt = REGISTRY.zone_types[type];
    const count = countZones(type);
    const full = count >= limits.max;
    const drawingThis = ED.drawing && ED.drawing.type === type;
    html += `<button class="btn ${drawingThis ? "placing" : ""}" ${full && !drawingThis ? "disabled" : ""}
      onclick="startZone('${type}')" title="${full ? "Numero massimo raggiunto" : "Clicca i vertici sulla mappa, poi chiudi l'area"}">
      <span class="shape" style="--c:${zt.color}; border-radius:3px; opacity:.7"></span>
      ${esc(zt.label)} <span class="muted" style="margin-left:auto">${count}/${limits.max}${limits.min ? " (min " + limits.min + ")" : ""}</span></button>`;
  }
  box.innerHTML = html;
  updateHint();
}

function updateHint() {
  const hint = document.getElementById("ed-hint");
  if (!hint) return;
  if (ED.placing) {
    const mt = REGISTRY.marker_types[ED.placing];
    hint.style.display = "";
    hint.innerHTML = `📍 Clicca sulla mappa per piazzare <b>${esc(mt.label)}</b>.
      <button class="btn" onclick="cancelPlacing()">Annulla</button>`;
  } else if (ED.drawing) {
    const zt = REGISTRY.zone_types[ED.drawing.type];
    const n = ED.drawing.points.length;
    hint.style.display = "";
    hint.innerHTML = `✏️ <b>${esc(zt.label)}</b>: clicca i vertici sulla mappa (${n} finora).
      <button class="btn primary" ${n >= 3 ? "" : "disabled"} onclick="finishZone()">Chiudi area</button>
      <button class="btn" onclick="cancelPlacing()">Annulla</button>`;
  } else {
    hint.style.display = "none";
  }
}

function startPlacing(type) {
  cancelPlacing();
  ED.placing = type;
  renderPalette();
}

function startZone(type) {
  cancelPlacing();
  ED.drawing = { type: type, points: [], line: L.polyline([], { color: REGISTRY.zone_types[type].color, dashArray: "6 6" }).addTo(ED.map) };
  renderPalette();
}

function cancelPlacing() {
  ED.placing = null;
  if (ED.drawing) {
    ED.map.removeLayer(ED.drawing.line);
    ED.drawing = null;
  }
  renderPalette();
}

function mapClick(latlng) {
  if (ED.placing) {
    const type = ED.placing;
    const marker = { type: type, label: REGISTRY.marker_types[type].callsign, lat: +latlng.lat.toFixed(6), lon: +latlng.lng.toFixed(6) };
    ED.markers.push(marker);
    addMarkerLayer(marker);
    ED.placing = null;
    renderPalette();
  } else if (ED.drawing) {
    ED.drawing.points.push([+latlng.lat.toFixed(6), +latlng.lng.toFixed(6)]);
    ED.drawing.line.setLatLngs(ED.drawing.points);
    updateHint();
  }
}

function finishZone() {
  if (!ED.drawing || ED.drawing.points.length < 3) return;
  const zone = { type: ED.drawing.type, label: REGISTRY.zone_types[ED.drawing.type].label, points: ED.drawing.points };
  ED.zones.push(zone);
  ED.map.removeLayer(ED.drawing.line);
  ED.drawing = null;
  addZoneLayer(zone);
  renderPalette();
}

function addMarkerLayer(marker) {
  const mt = REGISTRY.marker_types[marker.type];
  const layer = L.marker([marker.lat, marker.lon], {
    draggable: true,
    icon: L.divIcon({ className: "", html: `<span class="map-shape ${mt.shape}" style="--c:${mt.color}"></span>`, iconSize: [16, 16], iconAnchor: [8, 8] }),
  }).addTo(ED.map);
  layer.bindTooltip(() => marker.label || mt.callsign, { direction: "top", offset: [0, -8] });
  layer.on("dragend", () => {
    const p = layer.getLatLng();
    marker.lat = +p.lat.toFixed(6);
    marker.lon = +p.lng.toFixed(6);
  });
  layer.on("click", () => {
    const idx = ED.markers.indexOf(marker);
    layer.bindPopup(`<b>${esc(mt.label)}</b><br>
      <input id="mk-label" value="${esc(marker.label || "")}" placeholder="${esc(mt.callsign)}" style="margin:6px 0; width:170px">
      <br><button class="btn" onclick="setMarkerLabel(${idx})">OK</button>
      <button class="btn danger" onclick="removeMarker(${idx})">🗑 Rimuovi</button>`).openPopup();
  });
  marker._layer = layer;
}

function setMarkerLabel(idx) {
  const marker = ED.markers[idx];
  const input = document.getElementById("mk-label");
  if (marker && input) marker.label = input.value.trim() || REGISTRY.marker_types[marker.type].callsign;
  marker._layer.closePopup();
}

function removeMarker(idx) {
  const marker = ED.markers[idx];
  if (!marker) return;
  ED.map.removeLayer(marker._layer);
  ED.markers.splice(idx, 1);
  renderPalette();
}

function addZoneLayer(zone) {
  const zt = REGISTRY.zone_types[zone.type];
  const layer = L.polygon(zone.points, { color: zt.color, weight: 3, fillOpacity: 0.18 }).addTo(ED.map);
  layer.bindTooltip(() => zone.label || zt.label);
  layer.on("click", () => {
    const idx = ED.zones.indexOf(zone);
    layer.bindPopup(`<b>${esc(zt.label)}</b> (${zone.points.length} vertici)<br>
      <button class="btn danger" style="margin-top:6px" onclick="removeZone(${idx})">🗑 Rimuovi</button>`).openPopup();
  });
  zone._layer = layer;
}

function removeZone(idx) {
  const zone = ED.zones[idx];
  if (!zone) return;
  ED.map.removeLayer(zone._layer);
  ED.zones.splice(idx, 1);
  renderPalette();
}

async function saveTemplate(btn) {
  const title = document.getElementById("ed-title").value.trim();
  if (!title) return toast("Il titolo è obbligatorio.", false);
  const center = ED.map.getCenter();
  const body = {
    title: title,
    description: document.getElementById("ed-desc").value.trim(),
    mode: ED.mode,
    duration_minutes: +document.getElementById("ed-duration").value,
    map: { lat: +center.lat.toFixed(6), lon: +center.lng.toFixed(6), zoom: ED.map.getZoom() },
    markers: ED.markers.map(m => ({ type: m.type, label: m.label, lat: m.lat, lon: m.lon })),
    zones: ED.zones.map(z => ({ type: z.type, label: z.label, points: z.points })),
    packages: [...ED.packages],
  };
  btn.disabled = true;
  try {
    if (ED.id) await api(`/templates/${ED.id}`, { method: "PUT", body });
    else await api("/templates", { method: "POST", body });
    toast("Template salvato.");
    ED = null;
    renderTemplates();
  } catch (e) {
    toast("Errore salvataggio: " + e.message, false);
    btn.disabled = false;
  }
}

/* ---- Tab Partite ---- */
let MATCH_TIMER = null;

function fmtCountdown(seconds) {
  if (seconds <= 0) return "00:00";
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  const mm = String(m).padStart(2, "0"), ss = String(s).padStart(2, "0");
  return h ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

async function renderMatches() {
  clearInterval(MATCH_TIMER);
  const el = document.getElementById("content");
  el.innerHTML = "Caricamento partite…";
  let matches;
  try {
    await ensureRegistry();
    matches = await api("/matches");
  } catch (e) {
    el.innerHTML = `<p>⚠️ ${esc(e.message)}</p>`;
    return;
  }
  const running = matches.filter(m => m.status === "running");
  const ended = matches.filter(m => m.status !== "running");

  const runningHtml = running.map(m => {
    const mode = REGISTRY.modes[m.mode] || { name: m.mode, icon: "❓" };
    return `
    <div class="match-card">
      <div>
        <strong>${mode.icon} ${esc(m.title)}</strong> <span class="pill ${m.expired ? "warn" : "ok"}">${m.expired ? "tempo scaduto" : "in corso"}</span><br>
        <span class="muted">${esc(mode.name)} · avviata ${fmtDT(m.started_at)} da ${esc(m.started_by || "")} · fine ${fmtDT(m.ends_at)}</span>
      </div>
      <div class="countdown" data-ends="${esc(m.ends_at)}">--:--</div>
      <span style="flex:1"></span>
      <button class="btn" onclick="republishMatch(${m.id}, this)"
        title="Ripubblica marker e aree: per gli EUD collegati dopo l'inizio">📡 Ripubblica</button>
      <button class="btn danger" onclick="endMatch(${m.id}, '${esc(m.title).replace(/'/g, "\\'")}', this)"
        title="Chiude la partita: i marker vengono cancellati dagli EUD e la fine annunciata in chat">⏹ Termina</button>
    </div>`;
  }).join("");

  const endedHtml = ended.length ? `
    <h3>Storico</h3>
    <table>
      <thead><tr><th>Partita</th><th>Modalità</th><th>Inizio</th><th>Fine</th><th>Avviata da</th></tr></thead>
      <tbody>${ended.map(m => {
        const mode = REGISTRY.modes[m.mode] || { name: m.mode };
        return `<tr><td>${esc(m.title)}</td><td>${esc(mode.name)}</td>
          <td>${fmtDT(m.started_at)}</td><td>${fmtDT(m.ended_at || m.ends_at)}</td><td>${esc(m.started_by || "")}</td></tr>`;
      }).join("")}</tbody>
    </table>` : "";

  el.innerHTML = `
    <div class="toolbar">
      <button class="btn" onclick="renderMatches()">↻ Aggiorna</button>
      <span class="muted">Il push iniziale raggiunge gli EUD collegati in quel momento: per chi entra dopo usa «Ripubblica».
        I marker spariscono da soli dagli ATAK alla fine della partita (stale).</span>
    </div>
    ${running.length ? runningHtml : "<p class='muted'>Nessuna partita in corso: avviane una dal tab Template missioni con ▶ Play.</p>"}
    ${endedHtml}`;

  const tick = () => document.querySelectorAll(".countdown").forEach(c => {
    const remaining = Math.floor((new Date(c.dataset.ends) - Date.now()) / 1000);
    c.textContent = fmtCountdown(remaining);
    c.style.color = remaining <= 0 ? "var(--absent)" : remaining < 300 ? "var(--maybe)" : "";
  });
  tick();
  if (running.length) MATCH_TIMER = setInterval(tick, 1000);
}

async function republishMatch(id, btn) {
  btn.disabled = true;
  try {
    const res = await api(`/matches/${id}/republish`, { method: "POST" });
    toast(`Ripubblicati ${res.republished} elementi a tutti gli EUD collegati.`);
  } catch (e) {
    toast("Errore: " + e.message, false);
  } finally {
    btn.disabled = false;
  }
}

async function endMatch(id, title, btn) {
  if (!confirm(`Terminare la partita "${title}"?\n\nI marker vengono cancellati dagli EUD e la fine annunciata in chat.`)) return;
  btn.disabled = true;
  try {
    const res = await api(`/matches/${id}/end`, { method: "POST" });
    toast(`Partita "${title}" terminata.` + (res.warning ? " ⚠️ " + res.warning : ""), !res.warning);
    renderMatches();
  } catch (e) {
    toast("Errore: " + e.message, false);
    btn.disabled = false;
  }
}

/* ---- Tab Modalità di gioco (anagrafica + config Game Master) ---- */
async function renderModes() {
  const el = document.getElementById("content");
  el.innerHTML = "Caricamento…";
  let cfg = {};
  try {
    await ensureRegistry();
    cfg = await api("/config");
  } catch (e) {
    el.innerHTML = `<p>⚠️ ${esc(e.message)}</p>`;
    return;
  }
  const cards = Object.entries(REGISTRY.modes).map(([key, mode]) => `
    <div class="mode-card">
      <h2>${mode.icon} ${esc(mode.name)}</h2>
      <p class="muted" style="margin:0">${esc(mode.description)}</p>
      <ul>
        ${Object.entries(mode.markers).map(([mk, lim]) => {
          const mt = REGISTRY.marker_types[mk];
          return `<li>${shapeHtml(mk)} <b>${esc(mt.label)}</b> <span class="muted">${lim.min === lim.max ? lim.min : lim.min + "–" + lim.max}</span></li>`;
        }).join("")}
        ${Object.entries(mode.zones).map(([zk, lim]) => {
          const zt = REGISTRY.zone_types[zk];
          return `<li><span class="shape" style="--c:${zt.color}; border-radius:3px; opacity:.7"></span>
            <b>${esc(zt.label)}</b> <span class="muted">${lim.min ? "obbligatoria" : "opzionale"}</span></li>`;
        }).join("")}
      </ul>
    </div>`).join("");
  el.innerHTML = `
    <p class="muted" style="margin-top:0">L'anagrafica delle modalità è definita nel plugin (<code>game_modes.py</code>):
      ogni modalità dichiara i marker e le aree richiesti. Su ATAK/WinTAK i marker usano la simbologia nativa:
      <b style="color:#E53935">rombo rosso</b> spawn Team A, <b style="color:#1E88E5">quadrato blu</b> spawn Team B,
      <b style="color:#c7a600">giallo</b> bandiera, <b style="color:#9C27B0">spot viola</b> bomb site;
      le aree arrivano come poligoni colorati.</p>
    <div class="mode-grid">${cards}</div>
    <h3 style="margin-top:20px">Configurazione Game Master</h3>
    <form class="inline" onsubmit="event.preventDefault(); saveGmConfig();">
      <label>Callsign del Game Master
        <input id="cfg-gm-callsign" size="24" value="${esc(cfg.OTS_EVENTCALENDAR_GM_CALLSIGN || "")}"
          title="Firma marker, messaggi in chat e invii data package">
      </label>
      <label>Indirizzo server per i download (vuoto = automatico)
        <input id="cfg-gm-server" size="30" value="${esc(cfg.OTS_EVENTCALENDAR_GM_SERVER_ADDRESS || "")}"
          placeholder="es. tak.miodominio.it"
          title="Hostname/IP che gli EUD usano per scaricare i data package annunciati al Play">
      </label>
      <button class="btn primary">Salva</button>
    </form>
    <p class="muted">I valori vengono salvati in <code>config.yml</code> sul server.</p>`;
}

async function saveGmConfig() {
  try {
    await api("/config", { method: "POST", body: {
      OTS_EVENTCALENDAR_GM_CALLSIGN: document.getElementById("cfg-gm-callsign").value.trim() || "Game Master",
      OTS_EVENTCALENDAR_GM_SERVER_ADDRESS: document.getElementById("cfg-gm-server").value.trim(),
    } });
    toast("Configurazione salvata.");
  } catch (e) { toast("Errore salvataggio: " + e.message, false); }
}

/* ---------------- Init ---------------- */
(async function init() {
  try {
    await refreshMe();
    renderTabs();
    const rid = hashReplayId();
    const id = hashEventId();
    if (rid) await renderReplay(rid);           // replay giocata (admin)
    else if (id) await renderEventDetail(id);   // link condiviso: solo quell'evento
    else if (isAdmin()) await renderEvents();   // calendario completo solo per admin
    else { currentTab = "leaderboard"; renderTabs(); await renderLeaderboard(); }
  } catch (err) {
    // Non autenticato (link aperto da WhatsApp senza sessione) o errore server
    document.getElementById("content").innerHTML = `
      <h2>Accesso richiesto</h2>
      <p>Per vedere il calendario eventi devi prima accedere con il tuo account OpenTAKServer.</p>
      <p><a class="btn primary" style="text-decoration:none;display:inline-block"
            href="${location.origin}/login" target="_top">Vai al login</a></p>
      <p class="muted">Dopo il login riapri il link che hai ricevuto per arrivare direttamente all'evento.</p>
      <p class="muted">Dettaglio: ${esc(err.message)}</p>`;
  }
})();
// Cambio hash: apri la vista del singolo evento, o torna alla vista di default
window.addEventListener("hashchange", () => {
  const rid = hashReplayId();
  const id = hashEventId();
  if (rid) renderReplay(rid);
  else if (id) renderEventDetail(id);
  else goCalendar();
});
</script>
