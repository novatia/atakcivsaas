<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario Eventi</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f5f6f8; --panel: #ffffff; --border: #dde1e6; --text: #1b1f24;
    --muted: #6b7280; --accent: #2f6f3e; --accent-2: #4c8c5c;
    --present: #2e7d32; --absent: #c62828; --maybe: #ef6c00; --neutral: #78909c;
    --tab: #eceff1; --btn: #ffffff; --btn-hover: #f0f2f4; --input: #ffffff;
    --highlight-glow: rgba(47,111,62,.15);
  }
  /* Modalità notte: automatica dal sistema, forzabile con il bottone 🌙/☀️ */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #14181c; --panel: #1e242b; --border: #333d47; --text: #e4e8ec;
      --muted: #93a0ad; --accent: #4d9861; --accent-2: #5fae74;
      --present: #43a047; --absent: #e05555; --maybe: #f58c2e; --neutral: #8aa0ae;
      --tab: #262d35; --btn: #262d35; --btn-hover: #2f3842; --input: #171c21;
      --highlight-glow: rgba(93,174,116,.22);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14181c; --panel: #1e242b; --border: #333d47; --text: #e4e8ec;
    --muted: #93a0ad; --accent: #4d9861; --accent-2: #5fae74;
    --present: #43a047; --absent: #e05555; --maybe: #f58c2e; --neutral: #8aa0ae;
    --tab: #262d35; --btn: #262d35; --btn-hover: #2f3842; --input: #171c21;
    --highlight-glow: rgba(93,174,116,.22);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  #me-box { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--muted); }
  #me-box img { width: 32px; height: 32px; object-fit: contain; }
  nav { display: flex; gap: 4px; padding: 8px 20px 0; flex-wrap: wrap; }
  nav button { border: 1px solid var(--border); border-bottom: none; background: var(--tab); color: var(--text); padding: 8px 14px; cursor: pointer; border-radius: 6px 6px 0 0; font-size: 13px; }
  nav button.active { background: var(--panel); font-weight: 600; color: var(--accent); }
  main { padding: 16px 20px 40px; }
  section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 0 8px 8px 8px; padding: 16px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  h3 { font-size: 13px; margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .btn { border: 1px solid var(--border); background: var(--btn); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
  .btn:hover { background: var(--btn-hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-2); }
  .btn.danger { color: var(--absent); border-color: #e7bdbd; }
  .btn.small { padding: 3px 8px; font-size: 12px; }
  .rsvp-group { display: inline-flex; gap: 4px; }
  .rsvp-group .btn.on-present { background: var(--present); color: #fff; border-color: var(--present); }
  .rsvp-group .btn.on-absent { background: var(--absent); color: #fff; border-color: var(--absent); }
  .rsvp-group .btn.on-maybe { background: var(--maybe); color: #fff; border-color: var(--maybe); }
  .badge-chip { display: inline-flex; align-items: center; gap: 6px; }
  .badge-chip img { width: 26px; height: 26px; object-fit: contain; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11.5px; color: #fff; }
  .pill.present { background: var(--present); } .pill.absent { background: var(--absent); }
  .pill.maybe { background: var(--maybe); } .pill.not_configured { background: var(--neutral); }
  .event-card { border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; }
  .event-card.past { opacity: .65; }
  .event-card.highlight { outline: 3px solid var(--accent); box-shadow: 0 0 0 6px var(--highlight-glow); }
  .event-head { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .event-head strong { font-size: 15px; }
  .event-meta { color: var(--muted); font-size: 12.5px; margin: 4px 0; }
  .event-desc { white-space: pre-wrap; margin: 6px 0; }
  .counts { font-size: 12px; color: var(--muted); }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  form.inline label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, textarea { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; background: var(--input); color: var(--text); }
  textarea { width: 100%; min-height: 60px; }
  #toast { position: fixed; bottom: 16px; right: 16px; background: #263238; color: #fff; padding: 10px 16px; border-radius: 8px; display: none; max-width: 380px; z-index: 2000; }
  /* Replay giocata */
  #rp-map { height: min(62vh, 560px); min-height: 340px; border: 1px solid var(--border); border-radius: 8px; margin-top: 10px; }
  .rp-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rp-clock { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; margin-left: auto; }
  .rp-speed.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #rp-slider { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  #rp-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; }
  #rp-legend label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font-size: 12.5px; }
  .rp-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,.5); flex: none; }
  .rp-marker { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .rp-name { font-size: 11px; font-weight: 600; color: #111; background: rgba(255,255,255,.85); padding: 0 4px; border-radius: 4px; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
</style>
<script>
  // Applica subito il tema salvato per evitare il flash chiaro/scuro al caricamento
  try {
    const saved = localStorage.getItem("ec_theme");
    if (saved === "dark" || saved === "light") document.documentElement.dataset.theme = saved;
  } catch (e) {}
</script>
</head>
<body>
<header>
  <h1>📅 Calendario Eventi</h1>
  <div id="me-box"></div>
  <button class="btn" id="theme-btn" onclick="toggleTheme()" title="Modalità notte/giorno">🌙</button>
</header>
<nav id="tabs"></nav>
<main><section class="panel" id="content">Caricamento…</section></main>
<div id="toast"></div>

<script>
"use strict";
const API = location.pathname.replace(/\/ui\/?$/, "");
let ME = null, FIELDS = [], RANKS = [];

function xsrf() {
  const m = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
  return m ? decodeURIComponent(m[1]) : "";
}
async function api(path, opts = {}) {
  opts.headers = Object.assign({}, opts.headers);
  if (opts.method && opts.method !== "GET") {
    const token = xsrf();
    opts.headers["X-XSRF-TOKEN"] = token;
    opts.headers["X-CSRFToken"] = token;
  }
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(API + path, opts);
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON */ }
  if (!res.ok) throw new Error((data && data.error) || ("HTTP " + res.status));
  return data;
}
function toast(msg, ok = true) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.background = ok ? "#2e7d32" : "#c62828";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 4000);
}
function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtDT(iso) {
  if (!iso) return "";
  return new Date(iso).toLocaleString("it-IT", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}
function isAdmin() { return ME && ME.roles.includes("administrator"); }

/* ---------------- Modalità notte ---------------- */
function isDarkNow() {
  const t = document.documentElement.dataset.theme;
  if (t) return t === "dark";
  return window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function updateThemeButton() {
  const btn = document.getElementById("theme-btn");
  if (btn) btn.textContent = isDarkNow() ? "☀️" : "🌙";
}
function toggleTheme() {
  const next = isDarkNow() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("ec_theme", next); } catch (e) {}
  updateThemeButton();
}
updateThemeButton();
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeButton);
function badgeImg(rank, size) {
  if (!rank || !rank.badge_filename) return "";
  return `<img src="${API}/badges/${encodeURIComponent(rank.badge_filename)}" width="${size}" height="${size}" style="object-fit:contain" alt="">`;
}

/* ---------------- Tabs ---------------- */
const TABS = [
  { id: "events", label: "Eventi", admin: true, render: () => { clearEventHash(); renderEvents(); } },
  { id: "leaderboard", label: "Classifica", admin: false, render: () => { clearEventHash(); renderLeaderboard(); } },
  { id: "attendance", label: "Presenze", admin: true, render: renderAttendance },
  { id: "players", label: "Giocatori", admin: true, render: renderPlayers },
  { id: "fields", label: "Campi da gioco", admin: true, render: renderFields },
  { id: "ranks", label: "Gradi e badge", admin: true, render: renderRanks },
  { id: "import", label: "Import", admin: true, render: renderImport },
  { id: "maintenance", label: "Manutenzione", admin: true, render: renderMaintenance },
];
let currentTab = "events";

function renderTabs() {
  const nav = document.getElementById("tabs");
  nav.style.display = "flex";
  document.getElementById("content").style.borderRadius = "";
  nav.innerHTML = "";
  for (const tab of TABS) {
    if (tab.admin && !isAdmin()) continue;
    const btn = document.createElement("button");
    btn.textContent = tab.label;
    btn.className = tab.id === currentTab ? "active" : "";
    btn.onclick = () => { currentTab = tab.id; renderTabs(); tab.render(); };
    nav.appendChild(btn);
  }
}

async function refreshMe() {
  ME = await api("/me");
  const box = document.getElementById("me-box");
  const rank = ME.rank;
  const name = ME.player ? ME.player.display_name : ME.username;
  box.innerHTML = `${rank ? badgeImg(rank, 32) : ""}
    <span><strong>${esc(name)}</strong>${rank ? " · " + esc(rank.name) : ""} · ${ME.score} punti</span>`;
}

/* ---------------- Eventi ---------------- */
async function renderEvents() {
  const el = document.getElementById("content");
  el.innerHTML = "<h2>Eventi</h2><div id='ev-admin'></div><div id='ev-list'>Caricamento…</div>";

  if (isAdmin()) {
    if (!FIELDS.length) FIELDS = await api("/fields");
    document.getElementById("ev-admin").innerHTML = `
      <h3>Nuovo evento</h3>
      <form class="inline" id="ev-form">
        <label>Titolo <input name="title" required></label>
        <label>Sede di gioco <select name="field_id" required>
          ${FIELDS.filter(f => f.active).map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("")}
        </select></label>
        <label>Inizio <input type="datetime-local" name="start_time" required></label>
        <label>Fine <input type="datetime-local" name="end_time" required></label>
        <label style="flex:1;min-width:220px">Descrizione <input name="description"></label>
        <button class="btn primary" type="submit">Crea evento</button>
      </form><h3>Calendario</h3>`;
    document.getElementById("ev-form").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/events", { method: "POST", body: Object.fromEntries(fd.entries()) });
        toast("Evento creato"); renderEvents();
      } catch (err) { toast(err.message, false); }
    };
  }

  const events = await api("/events");
  const list = document.getElementById("ev-list");
  window._events = events;

  const now = new Date();
  const isPast = ev => new Date(ev.end_time) < now;
  const pastCount = events.filter(isPast).length;

  // Eventi passati nascosti di default; flag per mostrarli (ricordata sul dispositivo)
  let showPast = false;
  try { showPast = localStorage.getItem("ec_show_past") === "1"; } catch (e) {}
  const visible = showPast ? events : events.filter(e => !isPast(e));

  let html = pastCount ? `<label class="muted" style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
      <input type="checkbox" ${showPast ? "checked" : ""} onchange="togglePast(this.checked)">
      Mostra eventi passati (${pastCount})</label>` : "";
  if (!visible.length) {
    list.innerHTML = html + "<p class='muted'>Nessun evento in programma.</p>";
    return;
  }
  list.innerHTML = html + visible.map(ev => {
    const past = isPast(ev);
    const st = ev.my_rsvp;
    return `<div class="event-card ${past ? "past" : ""}" id="event-${ev.id}">
      <div class="event-head">
        <strong><a href="#event-${ev.id}" style="color:inherit">${esc(ev.title)}</a></strong>
        <span class="pill ${st}">${{present:"Presente",absent:"Non presente",maybe:"In dubbio",not_configured:"Non configurato"}[st]}</span>
        <span style="margin-left:auto">
          <button class="btn small" onclick="copyEventLink(${ev.id})" title="Copia il link all'evento per condividerlo">📋 Copia link</button>
          ${isAdmin() ? `<button class="btn small" onclick="location.hash='#replay-${ev.id}'" title="Rivedi su mappa i movimenti degli EUD durante l'evento">▶ Giocata</button>
          <button class="btn small" onclick="editEvent(${ev.id})">✏️ Modifica</button>
          <button class="btn small danger" onclick="delEvent(${ev.id})">Elimina</button>` : ""}
        </span>
      </div>
      <div class="event-meta">📍 ${esc(ev.field ? ev.field.name : "?")}${ev.field && ev.field.address ? " — " + esc(ev.field.address) : ""}</div>
      <div class="event-meta">🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</div>
      ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ""}
      <div class="counts">✅ ${ev.counts.present} presenti · ❌ ${ev.counts.absent} assenti · ❔ ${ev.counts.maybe} in dubbio · 🏅 ${ev.counts.confirmed} confermati sul campo</div>
      ${past ? "" : `<div style="margin-top:8px" class="rsvp-group">
        <button class="btn ${st === "present" ? "on-present" : ""}" onclick="rsvp(${ev.id},'present')">Presente</button>
        <button class="btn ${st === "absent" ? "on-absent" : ""}" onclick="rsvp(${ev.id},'absent')">Non presente</button>
        <button class="btn ${st === "maybe" ? "on-maybe" : ""}" onclick="rsvp(${ev.id},'maybe')">In dubbio</button>
      </div>`}
    </div>`;
  }).join("");
}
function togglePast(show) {
  try { localStorage.setItem("ec_show_past", show ? "1" : "0"); } catch (e) {}
  renderEvents();
}

/* ---------------- Vista singolo evento (link condiviso) ---------------- */
function hashEventId() {
  const m = location.hash.match(/^#event-(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}
function clearEventHash() {
  if (location.hash) history.replaceState(null, "", location.pathname + location.search);
}
function goCalendar() {
  clearEventHash();
  if (isAdmin()) {
    currentTab = "events";
    renderTabs();
    renderEvents();
  } else {
    currentTab = "leaderboard";
    renderTabs();
    renderLeaderboard();
  }
}
async function renderEventDetail(id) {
  // Vista standalone del singolo evento: niente menu, solo l'evento
  document.getElementById("tabs").style.display = "none";
  const el = document.getElementById("content");
  el.style.borderRadius = "8px";
  el.innerHTML = "Caricamento…";
  let ev;
  try {
    ev = await api(`/events/${id}`);
  } catch (err) {
    el.innerHTML = `<h2>Evento non trovato</h2><p class="muted">${esc(err.message)}</p>`;
    return;
  }
  const past = new Date(ev.end_time) < new Date();
  const st = ev.my_rsvp;
  el.innerHTML = `
    <div class="event-card ${past ? "past" : ""}">
      <div class="event-head">
        <strong style="font-size:17px">${esc(ev.title)}</strong>
        <span class="pill ${st}">${{present:"Presente",absent:"Non presente",maybe:"In dubbio",not_configured:"Non configurato"}[st]}</span>
        <span style="margin-left:auto">
          ${isAdmin() ? `<button class="btn small" onclick="location.hash='#replay-${ev.id}'">▶ Giocata</button>` : ""}
          <button class="btn small" onclick="copyEventLink(${ev.id})">📋 Copia link</button>
        </span>
      </div>
      <div class="event-meta">📍 ${esc(ev.field ? ev.field.name : "?")}${ev.field && ev.field.address ? " — " + esc(ev.field.address) : ""}</div>
      <div class="event-meta">🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</div>
      ${ev.description ? `<div class="event-desc">${esc(ev.description)}</div>` : ""}
      <div class="counts">✅ ${ev.counts.present} presenti · ❌ ${ev.counts.absent} assenti · ❔ ${ev.counts.maybe} in dubbio · 🏅 ${ev.counts.confirmed} confermati sul campo</div>
      ${past ? "<p class='muted'>Evento concluso.</p>" : ev.has_player ? `
      <p style="margin:10px 0 4px"><strong>La tua presenza:</strong></p>
      <div class="rsvp-group">
        <button class="btn ${st === "present" ? "on-present" : ""}" onclick="rsvp(${ev.id},'present')">Presente</button>
        <button class="btn ${st === "absent" ? "on-absent" : ""}" onclick="rsvp(${ev.id},'absent')">Non presente</button>
        <button class="btn ${st === "maybe" ? "on-maybe" : ""}" onclick="rsvp(${ev.id},'maybe')">In dubbio</button>
      </div>` : `
      <p class="muted">⚠️ Il tuo account non è ancora associato a un giocatore della squadra:
      chiedi a un amministratore di associarti dall'anagrafica Giocatori per poter dichiarare la presenza.</p>`}
    </div>
    <h3>Ospiti in prova (${ev.guests.length})</h3>
    ${ev.guests.length ? `<table><thead><tr><th>Nome</th><th>Registrato da</th><th></th></tr></thead><tbody>
      ${ev.guests.map(g => `<tr>
        <td>${esc(g.first_name)} ${esc(g.last_name)}${g.confirmed ? " 🏅" : ""}</td>
        <td class="muted">${esc(g.added_by_username || "—")}</td>
        <td>${g.can_delete ? `<button class="btn small danger" onclick="deleteGuest(${g.id}, ${ev.id})">Rimuovi</button>` : ""}</td>
      </tr>`).join("")}
    </tbody></table>` : "<p class='muted'>Nessun ospite registrato.</p>"}
    ${past ? "" : `
    <form class="inline" id="guest-form" style="margin-top:10px">
      <label>Nome <input name="first_name" required></label>
      <label>Cognome <input name="last_name" required></label>
      <button class="btn primary" type="submit">Registra ospite</button>
    </form>
    <p class="muted">Porti qualcuno a provare? Registralo qui con nome e cognome: comparirà nella lista presenze dell'evento.</p>`}
  `;
  const form = document.getElementById("guest-form");
  if (form) form.onsubmit = async (e) => {
    e.preventDefault();
    try {
      await api(`/events/${id}/guests`, { method: "POST", body: Object.fromEntries(new FormData(e.target).entries()) });
      toast("Ospite registrato");
      renderEventDetail(id);
    } catch (err) { toast(err.message, false); }
  };
}
async function deleteGuest(guestId, eventId) {
  if (!confirm("Rimuovere questo ospite?")) return;
  try {
    await api(`/guests/${guestId}`, { method: "DELETE" });
    toast("Ospite rimosso");
    if (hashEventId() === eventId) renderEventDetail(eventId);
    else if (window._reloadAttendance) window._reloadAttendance();
  } catch (err) { toast(err.message, false); }
}
async function confirmGuest(guestId, confirmed) {
  try {
    await api(`/guests/${guestId}/confirm`, { method: "POST", body: { confirmed } });
    toast(confirmed ? "Presenza ospite confermata" : "Presenza ospite revocata");
  } catch (err) {
    toast(err.message, false);
    if (window._reloadAttendance) window._reloadAttendance();
  }
}
function eventUrl(id) {
  return location.origin + location.pathname.replace(/\/$/, "") + "#event-" + id;
}
async function copyEventLink(id) {
  const ev = (window._events || []).find(e => e.id === id);
  const url = eventUrl(id);
  const text = ev
    ? `🗓 ${ev.title}\n📍 ${ev.field ? ev.field.name : ""}\n🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}\n${url}`
    : url;
  try {
    await navigator.clipboard.writeText(text);
    toast("Link copiato! Incollalo su WhatsApp.");
  } catch (e) {
    // Clipboard non disponibile (permessi/iframe): mostra il testo da copiare a mano
    prompt("Copia il testo e incollalo su WhatsApp:", text);
  }
}
// Form di modifica evento inline nella card (solo admin)
async function editEvent(id) {
  const ev = (window._events || []).find(e => e.id === id);
  if (!ev) return;
  if (!FIELDS.length) FIELDS = await api("/fields");
  const card = document.getElementById("event-" + id);
  const toLocal = iso => iso ? iso.slice(0, 16) : "";
  card.innerHTML = `

// Leaflet caricato on-demand da CDN solo quando si apre un replay
let _leafletPromise = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (_leafletPromise) return _leafletPromise;
  _leafletPromise = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    css.integrity = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";
    css.crossOrigin = "";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.integrity = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
    js.crossOrigin = "";
    js.onload = resolve;
    js.onerror = () => { _leafletPromise = null; reject(new Error("Impossibile caricare la libreria mappa (serve la connessione internet)")); };
    document.body.appendChild(js);
  });
  return _leafletPromise;
}

const RP_COLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#808000","#9a6324","#469990","#800000","#000075","#fabed4","#aaffc3","#dcbeff","#bfef45"];
const RP_SPEEDS = [1, 3, 5, 10, 100];
let RP = null;          // stato del replay corrente
let _rpToken = 0;       // invalida il loop di animazione dei replay precedenti

function hashReplayId() {
  const m = location.hash.match(/^#replay-(\d+)$/);
  return m ? parseInt(m[1], 10) : null;
}

function rpClock(t) {
  return new Date(t * 1000).toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}

async function renderReplay(id) {
  document.getElementById("tabs").style.display = "none";
  const el = document.getElementById("content");
  el.style.borderRadius = "8px";
  el.innerHTML = "Caricamento tracce…";
  if (RP && RP.map) { try { RP.map.remove(); } catch (e) {} }
  RP = null;

  let data;
  try {
    await loadLeaflet();
    data = await api(`/events/${id}/replay`);
  } catch (err) {
    el.innerHTML = `<h2>Replay non disponibile</h2><p class="muted">${esc(err.message)}</p>
      <p><button class="btn" onclick="goCalendar()">← Torna al calendario</button></p>`;
    return;
  }

  const ev = data.event;
  const header = `
    <div class="rp-bar">
      <button class="btn" onclick="goCalendar()">← Calendario</button>
      <strong>▶ ${esc(ev.title)}</strong>
      <span class="muted">📍 ${esc(ev.field ? ev.field.name : "?")} · 🕓 ${fmtDT(ev.start_time)} → ${fmtDT(ev.end_time)}</span>
    </div>`;

  if (!data.tracks.length) {
    el.innerHTML = header + `
      <p style="margin-top:14px">Nessuna traccia GPS registrata nella finestra dell'evento.</p>
      <p class="muted">Le tracce vengono salvate solo per gli EUD (ATAK/WinTAK) collegati al server
         durante la giocata, e richiedono che il processo cot_parser di OpenTAKServer sia attivo.</p>`;
    return;
  }

  el.innerHTML = header + `
    <div class="rp-bar" style="margin-top:10px">
      <button class="btn primary" id="rp-play" title="Riproduci/Pausa">▶</button>
      ${RP_SPEEDS.map(s => `<button class="btn rp-speed" data-speed="${s}">${s}x</button>`).join("")}
      <span class="rp-clock" id="rp-clock"></span>
    </div>
    <input type="range" id="rp-slider" min="${data.start}" max="${data.end}" step="1">
    <div id="rp-map"></div>
    <div id="rp-legend"></div>
    <p class="muted" style="margin-top:6px">Vengono mostrati tutti gli EUD che hanno inviato la posizione
       durante l'evento. Usa le caselle qui sopra per nascondere le tracce che non ti interessano.</p>`;

  const map = L.map("rp-map");
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);

  // Marker della sede di gioco
  if (ev.field && ev.field.latitude != null && ev.field.longitude != null) {
    L.marker([ev.field.latitude, ev.field.longitude], {
      icon: L.divIcon({ className: "", html: "📍", iconSize: [20, 20], iconAnchor: [10, 18] }),
    }).addTo(map).bindTooltip(ev.field.name);
  }

  const tracks = data.tracks.map((t, i) => {
    const color = RP_COLORS[i % RP_COLORS.length];
    const latlngs = t.points.map(p => [p[1], p[2]]);
    const marker = L.marker(latlngs[0], {
      icon: L.divIcon({
        className: "",
        html: `<div class="rp-marker"><span class="rp-dot" style="background:${color}"></span><span class="rp-name">${esc(t.callsign)}</span></div>`,
        iconSize: null,
        iconAnchor: [8, 8],
      }),
      zIndexOffset: 100,
    });
    const trail = L.polyline([], { color, weight: 3, opacity: 0.7 }).addTo(map);
    return { ...t, color, latlngs, marker, trail, onMap: false, visible: true, lastIdx: -2 };
  });

  const bounds = L.latLngBounds(tracks.flatMap(t => t.latlngs));
  map.fitBounds(bounds.pad(0.1));
  // Se il contenitore non era ancora dimensionato (iframe/tab appena mostrati) rimisura e ricentra
  setTimeout(() => { map.invalidateSize(); map.fitBounds(bounds.pad(0.1)); }, 150);

  // La riproduzione parte dal primo punto registrato, non dall'inizio (magari vuoto) dell'evento
  const firstT = Math.min(...tracks.map(t => t.points[0][0]));
  RP = {
    map, tracks,
    start: data.start, end: data.end,
    clock: Math.max(data.start, firstT),
    speed: 1, playing: false, last: null,
  };

  document.getElementById("rp-legend").innerHTML = tracks.map((t, i) => `
    <label><input type="checkbox" checked onchange="rpToggle(${i}, this.checked)">
    <span class="rp-dot" style="background:${t.color}"></span>${esc(t.callsign)}
    <span class="muted">(${t.points.length} punti)</span></label>`).join("");

  document.getElementById("rp-play").onclick = () => rpSetPlaying(!RP.playing);
  document.querySelectorAll(".rp-speed").forEach(btn => {
    btn.onclick = () => {
      RP.speed = parseInt(btn.dataset.speed, 10);
      document.querySelectorAll(".rp-speed").forEach(b => b.classList.toggle("on", b === btn));
    };
  });
  document.querySelector('.rp-speed[data-speed="1"]').classList.add("on");
  const slider = document.getElementById("rp-slider");
  slider.value = RP.clock;
  slider.oninput = () => { RP.clock = parseFloat(slider.value); rpUpdate(false); };

  rpUpdate(false);

  const token = ++_rpToken;
  requestAnimationFrame(function frame(ts) {
    if (token !== _rpToken || !document.getElementById("rp-map")) return;
    if (RP.playing && RP.last != null) {
      // dt limitato: al ritorno da una scheda in background il replay non deve saltare avanti
      const dt = Math.min(0.5, (ts - RP.last) / 1000);
      RP.clock = Math.min(RP.end, RP.clock + dt * RP.speed);
      if (RP.clock >= RP.end) rpSetPlaying(false);
      rpUpdate(true);
    }
    RP.last = ts;
    requestAnimationFrame(frame);
  });
}

function rpSetPlaying(playing) {
  if (!RP) return;
  // Se la riproduzione è arrivata in fondo, ▶ riparte dall'inizio
  if (playing && RP.clock >= RP.end) RP.clock = RP.start;
  RP.playing = playing;
  const btn = document.getElementById("rp-play");
  if (btn) btn.textContent = playing ? "⏸" : "▶";
}

function rpToggle(index, visible) {
  const t = RP.tracks[index];
  t.visible = visible;
  if (!visible) {
    if (t.onMap) { RP.map.removeLayer(t.marker); t.onMap = false; }
    RP.map.removeLayer(t.trail);
  } else {
    t.trail.addTo(RP.map);
    t.lastIdx = -2;
    rpUpdate(false);
  }
}

// Ultimo indice con timestamp <= t (ricerca binaria), -1 se prima del primo punto
function rpLocate(points, t) {
  let lo = 0, hi = points.length - 1, ans = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (points[mid][0] <= t) { ans = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return ans;
}

function rpUpdate(fromLoop) {
  if (!RP) return;
  const clock = RP.clock;
  for (const t of RP.tracks) {
    if (!t.visible) continue;
    const i = rpLocate(t.points, clock);
    if (i < 0) {
      // Prima del primo punto di questo EUD: non ancora in mappa
      if (t.onMap) { RP.map.removeLayer(t.marker); t.onMap = false; }
      if (t.lastIdx !== -1) { t.trail.setLatLngs([]); t.lastIdx = -1; }
      continue;
    }
    if (!t.onMap) { t.marker.addTo(RP.map); t.onMap = true; }

    let lat = t.points[i][1], lon = t.points[i][2];
    if (i < t.points.length - 1) {
      // Interpolazione lineare tra due campioni, ma non sui buchi (EUD spento/offline)
      const a = t.points[i], b = t.points[i + 1], gap = b[0] - a[0];
      if (gap > 0 && gap <= 120) {
        const f = (clock - a[0]) / gap;
        lat = a[1] + (b[1] - a[1]) * f;
        lon = a[2] + (b[2] - a[2]) * f;
      }
    }
    t.marker.setLatLng([lat, lon]);
    if (i !== t.lastIdx) { t.trail.setLatLngs(t.latlngs.slice(0, i + 1)); t.lastIdx = i; }
  }
  const clockEl = document.getElementById("rp-clock");
  if (clockEl) clockEl.textContent = rpClock(clock);
  if (fromLoop) {
    const slider = document.getElementById("rp-slider");
    if (slider) slider.value = clock;
  }
}

async function renderAttendance() {
  const el = document.getElementById("content");
  const events = await api("/events");
  el.innerHTML = `<h2>Conferma presenze sul campo</h2>
    <form class="inline"><label>Evento
      <select id="att-event">${events.map(ev => `<option value="${ev.id}">${fmtDT(ev.start_time)} — ${esc(ev.title)}</option>`).join("")}</select>
    </label></form><div id="att-list"></div>`;
  const select = document.getElementById("att-event");
  if (!events.length) { document.getElementById("att-list").innerHTML = "<p class='muted'>Nessun evento.</p>"; return; }
  // preseleziona l'evento più vicino a oggi
  const now = Date.now();
  let best = 0, bestDelta = Infinity;
  events.forEach((ev, i) => { const d = Math.abs(new Date(ev.start_time) - now); if (d < bestDelta) { bestDelta = d; best = i; } });
  select.selectedIndex = best;
  select.onchange = loadAttendance;
  await loadAttendance();

  async function loadAttendance() {
    const data = await api(`/events/${select.value}/attendance`);
    document.getElementById("att-list").innerHTML = `
      <p>
        <button class="btn primary" onclick="confirmAll(${data.event.id}, true)">✅ Tutta la squadra presente</button>
        <button class="btn" onclick="confirmAll(${data.event.id}, false)">Annulla tutte le conferme</button>
      </p>
      <table><thead><tr>
      <th>Giocatore</th><th>Dichiarazione</th><th>Presenza confermata</th></tr></thead><tbody>
      ${data.attendance.map(a => `<tr>
        <td>${esc(a.display_name)}</td>
        <td><span class="pill ${a.rsvp_status}">${{present:"Presente",absent:"Non presente",maybe:"In dubbio",not_configured:"Non configurato"}[a.rsvp_status]}</span></td>
        <td><input type="checkbox" ${a.confirmed ? "checked" : ""}
             onchange="confirmAttendance(${data.event.id}, ${a.player_id}, this.checked)"></td>
      </tr>`).join("")}
      </tbody></table>
      <p class="muted">La conferma vale anche per chi non ha dichiarato nulla: spuntando la casella il giocatore
      riceve i punti presenza; togliendo la spunta i punti vengono revocati.</p>
      ${data.guests.length ? `<h3>Ospiti in prova (${data.guests.length})</h3>
      <table><thead><tr><th>Nome</th><th>Registrato da</th><th>Presenza confermata</th><th></th></tr></thead><tbody>
        ${data.guests.map(g => `<tr>
          <td>${esc(g.first_name)} ${esc(g.last_name)}</td>
          <td class="muted">${esc(g.added_by_username || "—")}</td>
          <td><input type="checkbox" ${g.confirmed ? "checked" : ""} onchange="confirmGuest(${g.id}, this.checked)"></td>
          <td><button class="btn small danger" onclick="deleteGuest(${g.id}, ${data.event.id})">Rimuovi</button></td>
        </tr>`).join("")}
      </tbody></table>
      <p class="muted">Gli ospiti non hanno un account: la conferma registra solo la loro presenza, senza punti.</p>` : ""}`;
  }
  window._reloadAttendance = loadAttendance;
}

    toast("Giocatore aggiornato");
    if (reload) renderPlayers();
  } catch (err) { toast(err.message, false); renderPlayers(); }
}
async function linkPlayer(id, userId) {
  try {
    await api(`/players/${id}`, { method: "PUT", body: { user_id: userId ? parseInt(userId, 10) : null } });
    toast(userId ? "Account associato" : "Account scollegato");
    renderPlayers();
  } catch (err) { toast(err.message, false); renderPlayers(); }
}
async function delPlayer(id) {
  if (!confirm("Eliminare questo giocatore?")) return;
  try { await api(`/players/${id}`, { method: "DELETE" }); toast("Giocatore eliminato"); renderPlayers(); }
  catch (err) { toast(err.message, false); }
}

/* ---------------- Campi da gioco (admin) ---------------- */
async function renderFields() {
  const el = document.getElementById("content");
  FIELDS = await api("/fields");
  el.innerHTML = `<h2>Anagrafica campi da gioco</h2>
    <h3>Nuovo campo</h3>
    <form class="inline" id="field-form">
      <label>Nome <input name="name" required></label>
      <label>Indirizzo <input name="address"></label>
      <label>Lat <input name="latitude" type="number" step="any" style="width:90px"></label>
      <label>Lon <input name="longitude" type="number" step="any" style="width:90px"></label>
      <label style="flex:1;min-width:180px">Note <input name="description"></label>
      <button class="btn primary" type="submit">Aggiungi</button>
    </form>
    <table><thead><tr><th>Nome</th><th>Indirizzo</th><th>Coordinate</th><th>Note</th><th>Attivo</th><th></th></tr></thead><tbody>
    ${FIELDS.map(f => `<tr>
      <td><strong>${esc(f.name)}</strong></td><td>${esc(f.address || "")}</td>
      <td class="muted">${f.latitude != null ? f.latitude + ", " + f.longitude : ""}</td>
      <td>${esc(f.description || "")}</td>
      <td><input type="checkbox" ${f.active ? "checked" : ""} onchange="toggleField(${f.id}, this.checked)"></td>
      <td><button class="btn small danger" onclick="delField(${f.id})">Elimina</button></td>
    </tr>`).join("")}
    </tbody></table>`;
  document.getElementById("field-form").onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    if (data.latitude === "") delete data.latitude; else data.latitude = parseFloat(data.latitude);
    if (data.longitude === "") delete data.longitude; else data.longitude = parseFloat(data.longitude);
    try { await api("/fields", { method: "POST", body: data }); toast("Campo aggiunto"); renderFields(); }
    catch (err) { toast(err.message, false); }
  };
}
async function toggleField(id, active) {
  try { await api(`/fields/${id}`, { method: "PUT", body: { active } }); toast("Campo aggiornato"); }
  catch (err) { toast(err.message, false); renderFields(); }
}
async function delField(id) {
  if (!confirm("Eliminare questo campo?")) return;
  try { await api(`/fields/${id}`, { method: "DELETE" }); toast("Campo eliminato"); renderFields(); }
  catch (err) { toast(err.message, false); }
}

/* ---------------- Gradi e badge (admin) ---------------- */
async function renderRanks() {
  const el = document.getElementById("content");
  RANKS = await api("/ranks");
  el.innerHTML = `<h2>Gradi e badge</h2>
    <h3>Nuovo grado</h3>
    <form class="inline" id="rank-form">
      <label>Nome <input name="name" required></label>
      <label>Punti minimi <input name="min_score" type="number" min="0" required style="width:110px"></label>
      <button class="btn primary" type="submit">Aggiungi</button>
    </form>
    <table><thead><tr><th>Badge</th><th>Grado</th><th>Punti minimi</th><th>Carica badge</th><th></th></tr></thead><tbody>
    ${RANKS.map(r => `<tr>
      <td>${badgeImg(r, 34) || "<span class='muted'>—</span>"}</td>
      <td><input value="${esc(r.name)}" onchange="updateRank(${r.id}, {name: this.value})"></td>
      <td><input type="number" min="0" value="${r.min_score}" style="width:100px" onchange="updateRank(${r.id}, {min_score: parseInt(this.value, 10)})"></td>
      <td><input type="file" accept="image/*" onchange="uploadBadge(${r.id}, this)"></td>
      <td><button class="btn small danger" onclick="delRank(${r.id})">Elimina</button></td>
    </tr>`).join("")}
    </tbody></table>
    <p class="muted">Il grado di un operatore è il più alto con "punti minimi" ≤ ai suoi punti, salvo assegnazione manuale dalla Classifica.</p>`;
  document.getElementById("rank-form").onsubmit = async (e) => {
    e.preventDefault();
    const data = Object.fromEntries(new FormData(e.target).entries());
    data.min_score = parseInt(data.min_score, 10);
    try { await api("/ranks", { method: "POST", body: data }); toast("Grado aggiunto"); renderRanks(); }
    catch (err) { toast(err.message, false); }
  };
}
async function updateRank(id, body) {
  try { await api(`/ranks/${id}`, { method: "PUT", body }); toast("Grado aggiornato"); refreshMe(); }
  catch (err) { toast(err.message, false); renderRanks(); }
}
async function uploadBadge(id, input) {
  if (!input.files.length) return;
  const fd = new FormData();
  fd.append("file", input.files[0]);
  try { await api(`/ranks/${id}/badge`, { method: "POST", body: fd }); toast("Badge caricato"); renderRanks(); refreshMe(); }
  catch (err) { toast(err.message, false); }
}
async function delRank(id) {
  if (!confirm("Eliminare questo grado?")) return;
  try { await api(`/ranks/${id}`, { method: "DELETE" }); toast("Grado eliminato"); renderRanks(); refreshMe(); }
  catch (err) { toast(err.message, false); }
}

/* ---------------- Import (admin) ---------------- */
async function renderImport() {
  const el = document.getElementById("content");
  if (!FIELDS.length) FIELDS = await api("/fields");
  const fieldOptions = `<option value="">— nessuno —</option>` +
    FIELDS.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join("");
  el.innerHTML = `<h2>Import eventi</h2>
    <h3>Da Google Calendar (URL iCal/ICS)</h3>
    <p class="muted">In Google Calendar: Impostazioni → Integra il calendario → "Indirizzo segreto in formato iCal".
       Gli eventi già importati (stesso UID) vengono saltati: puoi rilanciare l'import per sincronizzare.
       La LOCATION dell'evento viene confrontata con i nomi dei campi da gioco.</p>
    <form class="inline" id="ics-form">
      <label style="flex:1;min-width:280px">URL ICS <input name="url" type="url" placeholder="https://calendar.google.com/calendar/ical/…/basic.ics" required></label>
      <label>Campo di default <select name="default_field_id">${fieldOptions}</select></label>
      <button class="btn primary" type="submit">Importa da URL</button>
    </form>
    <h3>Da file CSV</h3>
    <p class="muted">Intestazione: <code>title,description,field,start,end</code> — date in formato ISO
       (es. <code>2026-10-04T09:00</code>), separatore <code>,</code> o <code>;</code>.
       La colonna <code>field</code> è il nome del campo da gioco.</p>
    <form class="inline" id="csv-form">
      <label>File CSV <input name="file" type="file" accept=".csv,text/csv" required></label>
      <label>Campo di default <select name="default_field_id">${fieldOptions}</select></label>
      <button class="btn primary" type="submit">Importa CSV</button>
    </form>
    <div id="import-result"></div>`;

  document.getElementById("ics-form").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const result = await api("/import/ics", { method: "POST", body: {
        url: fd.get("url"),
        default_field_id: fd.get("default_field_id") || null,
      }});
      showImportResult(result);
    } catch (err) { toast(err.message, false); }
  };
  document.getElementById("csv-form").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      const result = await api("/import/csv", { method: "POST", body: fd });
      showImportResult(result);
    } catch (err) { toast(err.message, false); }
  };
}
function showImportResult(result) {
  toast(`Importati ${result.imported}, saltati ${result.skipped}`);
  document.getElementById("import-result").innerHTML =
    `<p><strong>Importati:</strong> ${result.imported} · <strong>Saltati (duplicati):</strong> ${result.skipped}</p>` +
    (result.errors.length ? `<p class="muted">Errori:<br>${result.errors.map(esc).join("<br>")}</p>` : "");
}

/* ---------------- Manutenzione (admin) ---------------- */
async function renderMaintenance() {
  const el = document.getElementById("content");
  el.innerHTML = "<h2>Manutenzione dati OpenTAKServer</h2><div id='maint'>Caricamento…</div>";
  const stats = await api("/maintenance/stats");
  document.getElementById("maint").innerHTML = `
    <p class="muted">Svuota le tabelle di OpenTAKServer quando si accumulano dati di test o vecchi.
       L'operazione è definitiva e riguarda tutte le righe.</p>
    <table style="max-width:520px"><thead><tr><th>Tabella</th><th>Righe</th><th></th></tr></thead><tbody>
      <tr><td>Alerts (allarmi inviati dagli EUD)</td><td><strong>${stats.alerts}</strong></td>
        <td><button class="btn danger small" onclick="clearTable('alerts', ${stats.alerts})">Svuota</button></td></tr>
      <tr><td>CasEvac (richieste di evacuazione)</td><td><strong>${stats.casevac}</strong></td>
        <td><button class="btn danger small" onclick="clearTable('casevac', ${stats.casevac})">Svuota</button></td></tr>
      <tr><td>Markers (punti disegnati sulla mappa)</td><td><strong>${stats.markers}</strong></td>
        <td><button class="btn danger small" onclick="clearTable('markers', ${stats.markers})">Svuota</button></td></tr>
    </tbody></table>
    <p class="muted">Per i marker viene trasmesso anche il CoT di cancellazione, così spariscono
       pure dalle mappe degli ATAK collegati.</p>`;
}
async function clearTable(target, count) {
  if (!count) { toast("Tabella già vuota"); return; }
  if (!confirm(`Eliminare definitivamente ${count} righe da "${target}"?`)) return;
  try {
    const result = await api("/maintenance/clear", { method: "POST", body: { target } });
    if (result.warning) toast(result.warning, false);
    else toast(`Eliminate ${result.deleted} righe da ${target}`);
    renderMaintenance();
  } catch (err) { toast(err.message, false); }
}

/* ---------------- Init ---------------- */
(async function init() {
  try {
    await refreshMe();
    renderTabs();
    const rid = hashReplayId();
    const id = hashEventId();
    if (rid) await renderReplay(rid);           // replay giocata (admin)
    else if (id) await renderEventDetail(id);   // link condiviso: solo quell'evento
    else if (isAdmin()) await renderEvents();   // calendario completo solo per admin
    else { currentTab = "leaderboard"; renderTabs(); await renderLeaderboard(); }
  } catch (err) {
    // Non autenticato (link aperto da WhatsApp senza sessione) o errore server
    document.getElementById("content").innerHTML = `
      <h2>Accesso richiesto</h2>
      <p>Per vedere il calendario eventi devi prima accedere con il tuo account OpenTAKServer.</p>
      <p><a class="btn primary" style="text-decoration:none;display:inline-block"
            href="${location.origin}/login" target="_top">Vai al login</a></p>
      <p class="muted">Dopo il login riapri il link che hai ricevuto per arrivare direttamente all'evento.</p>
      <p class="muted">Dettaglio: ${esc(err.message)}</p>`;
  }
})();
// Cambio hash: apri la vista del singolo evento, o torna alla vista di default
window.addEventListener("hashchange", () => {
  const rid = hashReplayId();
  const id = hashEventId();
  if (rid) renderReplay(rid);
  else if (id) renderEventDetail(id);
  else goCalendar();
});
</script>
